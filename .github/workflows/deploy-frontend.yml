name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "========================================"
            echo "🚀 Portfolio Frontend Deployment Started"
            echo "========================================"

            echo ""
            echo "📍 Current User"
            whoami

            echo ""
            echo "📍 Current Directory"
            pwd

            echo ""
            echo "📍 Moving to Project Directory..."
            cd /home/ubuntu/Abishekkrishnamoorthy-portfolio || exit 1

            echo ""
            echo "📍 Current Git Branch"
            git branch

            echo ""
            echo "📍 Checking for local changes..."
            if [ -n "$(git status --porcelain)" ]; then
              TIMESTAMP=$(date +%Y%m%d%H%M%S)
              BACKUP_DIR="/tmp/portfolio-deploy-backup-${TIMESTAMP}"
              mkdir -p "${BACKUP_DIR}" || exit 1

              echo "⚠️ Local changes detected; backing them up to ${BACKUP_DIR}"
              git diff --binary > "${BACKUP_DIR}/tracked.patch" || exit 1
              git diff --cached --binary > "${BACKUP_DIR}/staged.patch" || exit 1
              git ls-files --others --exclude-standard -z > "${BACKUP_DIR}/untracked-files.txt" || exit 1

              if [ -s "${BACKUP_DIR}/untracked-files.txt" ]; then
                tar --null --files-from="${BACKUP_DIR}/untracked-files.txt" \
                  --create --gzip --file="${BACKUP_DIR}/untracked-files.tar.gz" \
                  --ignore-failed-read || exit 1
              fi

              echo "✅ Local changes backed up; deployment will use origin/main"
            else
              echo "✅ Working tree is clean"
            fi

            echo ""
            echo "📍 Switching to main branch..."
            git checkout -f main || exit 1

            echo ""
            echo "📍 Fetching latest main..."
            if ! git fetch origin main --prune; then
              echo "⚠️ Remote-tracking ref is inconsistent; recreating origin/main"
              git update-ref -d refs/remotes/origin/main || true
              git fetch origin main --prune || exit 1
            fi

            echo ""
            echo "📍 Synchronizing checkout with origin/main..."
            git reset --hard origin/main || exit 1
            git clean -fd \
              -e '.env' \
              -e '.env.*' \
              -e 'frontend/.env*' \
              -e 'backend/.env*' \
              -e 'cms-frontend/.env*' || exit 1

            CURRENT_BRANCH=$(git branch --show-current)
            EXPECTED_COMMIT=$(git rev-parse origin/main)
            ACTUAL_COMMIT=$(git rev-parse HEAD)
            if [ "${CURRENT_BRANCH}" != "main" ] || [ "${EXPECTED_COMMIT}" != "${ACTUAL_COMMIT}" ]; then
              echo "❌ Checkout verification failed"
              echo "Branch: ${CURRENT_BRANCH}"
              echo "Expected commit: ${EXPECTED_COMMIT}"
              echo "Actual commit: ${ACTUAL_COMMIT}"
              exit 1
            fi

            echo "✅ Checkout synchronized: ${ACTUAL_COMMIT}"

            echo ""
            echo "📍 Moving to Frontend Directory..."
            cd frontend || exit 1

            echo ""
            echo "📍 Current Directory"
            pwd

            echo ""
            echo "📍 Node Version"
            node -v

            echo ""
            echo "📍 NPM Version"
            npm -v

            echo ""
            echo "📍 Installing Dependencies..."
            npm install || exit 1

            echo ""
            echo "📍 Building Next.js Application..."
            npm run build || exit 1

            echo ""
            echo "📍 Build Completed Successfully"

            echo ""
            echo "📍 Restarting PM2 Process..."
            pm2 restart portfolio-frontend || exit 1

            echo ""
            echo "📍 Saving PM2 Process List..."
            pm2 save

            echo ""
            echo "📍 PM2 Status"
            pm2 list

            echo ""
            echo "📍 Waiting for Application..."
            sleep 5

            echo ""
            echo "📍 Checking Application Status..."
            curl -I https://abishekkrishnamoorthy.online

            echo ""
            echo "========================================"
            echo "✅ Frontend Deployment Completed"
            echo "========================================"
